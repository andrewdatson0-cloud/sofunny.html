<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Image</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: #f3f4f6; }
    img { display: block; max-width: 100%; height: auto; max-height: calc(100vh - 32px); object-fit: contain; }
  </style>
</head>
<body>
  <img src="Funny.jpg" alt="Uploaded photo">
</body>
</html>
