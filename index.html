<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Funny Lady Animation</title>
<style>
*{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f1eb;font-family:Arial,sans-serif;padding:18px}
main{width:min(100%,1000px);text-align:center} h1{font-size:clamp(1.4rem,3vw,2.2rem);color:#292929;margin:0 0 14px}
img{display:block;width:100%;height:auto;border-radius:12px;box-shadow:0 8px 30px #0002}
p{color:#555}
</style>
</head>
<body><main><h1>Watch her broom, jump, and do push-ups!</h1><img src="Funny.gif" alt="Animated sequence of a woman sweeping, climbing through a window, and doing push-ups"><p>The animation repeats automatically.</p></main></body>
</html>
